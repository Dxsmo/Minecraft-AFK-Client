# Isolated local preview; credentials are kept in the ignored .env.local file.
# Start: docker compose -f docker-compose.local.yml up -d --wait
# Stop:  docker compose -f docker-compose.local.yml stop
name: afk-local

services:
  soulfire:
    image: minecraft-afk-client-soulfire:latest
    build: ./soulfire
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx2g -XX:+UseG1GC"
      TZ: Europe/Berlin
    volumes:
      - soulfire_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38765/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 180s

  backend:
    image: minecraft-afk-client-backend:latest
    build: ./backend
    restart: unless-stopped
    env_file: .env.local
    environment:
      HOST: "0.0.0.0"
      PORT: "4000"
      DATABASE_URL: "file:../data/afk.db"
      PUBLIC_ORIGIN: "http://localhost:8080"
      CORS_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080"
      SESSION_COOKIE_SECURE: "false"
      SOULFIRE_URL: "http://soulfire:38765"
      SOULFIRE_SECRET_KEY_FILE: "/soulfire-data/secret-key.bin"
      TZ: Europe/Berlin
    depends_on:
      soulfire:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - soulfire_data:/soulfire-data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: minecraft-afk-client-web:latest
    build: ./frontend
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ":80"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  soulfire_data:
  backend_data:
  caddy_data:
  caddy_config:
