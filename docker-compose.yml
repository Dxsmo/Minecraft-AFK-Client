services:
  soulfire:
    build:
      context: ./soulfire
    container_name: afk-soulfire
    restart: unless-stopped
    environment:
      JAVA_TOOL_OPTIONS: "${SOULFIRE_JAVA_OPTIONS:--XX:MaxRAMPercentage=65 -XX:+UseG1GC}"
      TZ: "${TZ:-Europe/Berlin}"
    volumes:
      - soulfire_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38765/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afk-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overridden here (not in .env) since inside the compose network the
      # frontend/Caddy container reaches the backend by service name.
      HOST: "0.0.0.0"
      PORT: "4000"
      # Local timezone for Node date formatting. Override via TZ in .env.
      TZ: "${TZ:-Europe/Berlin}"
      SOULFIRE_URL: "http://soulfire:38765"
      SOULFIRE_SECRET_KEY_FILE: "/soulfire-data/secret-key.bin"
    depends_on:
      soulfire:
        condition: service_healthy
    volumes:
      - backend_data:/app/data
      - soulfire_data:/soulfire-data:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: afk-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Set to your domain for automatic HTTPS via Caddy, e.g. "afk.example.com".
      # Leave as ":80" if Cloudflare/another proxy terminates TLS instead.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

  # Cloudflare Tunnel connector (optional, enable with: --profile tunnel).
  # Exposes the site on your Cloudflare domain WITHOUT any router port
  # forwarding or public IP. Create a tunnel in the Cloudflare dashboard
  # (Zero Trust -> Networks -> Tunnels), set its public hostname to
  # service "http://web:80", copy the connector token into TUNNEL_TOKEN in
  # .env, then run: docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: afk-tunnel
    restart: unless-stopped
    profiles:
      - tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on:
      - web
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  soulfire_data:
  backend_data:
  caddy_data:
  caddy_config:
