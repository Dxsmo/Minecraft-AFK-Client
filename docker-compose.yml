services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: afk-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overridden here (not in .env) since inside the compose network the
      # frontend/Caddy container reaches the backend by service name.
      HOST: "0.0.0.0"
      PORT: "4000"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - internal

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: afk-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # Set to your domain for automatic HTTPS via Caddy, e.g. "afk.example.com".
      # Leave as ":80" if Cloudflare/another proxy terminates TLS instead.
      SITE_ADDRESS: "${SITE_ADDRESS:-:80}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  backend_data:
  caddy_data:
  caddy_config:
