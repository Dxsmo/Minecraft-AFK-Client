# Disposable synthetic fixtures only. Never attach production data to this stack.
# Start: docker compose -f docker-compose.audit.yml up -d --build --wait --wait-timeout 1200
# Seed once: docker compose -f docker-compose.audit.yml exec -T backend node scripts/seed-audit-fixture.mjs
# Reload clients after seeding: docker compose -f docker-compose.audit.yml restart backend
# Cleanup test data: docker compose -f docker-compose.audit.yml down --volumes
name: afk-audit
services:
  soulfire:
    image: minecraft-afk-client-soulfire:latest
    build: ./soulfire
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx1536m -XX:+UseG1GC"
    mem_limit: 3g
    volumes:
      - soulfire_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:38765/health"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 900s
  backend:
    image: afk-audit-backend:latest
    build: ./backend
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/audit.db
      SESSION_SECRET: isolated-audit-fixture-session-secret
      SESSION_COOKIE_SECURE: "false"
      PUBLIC_ORIGIN: http://localhost:8082
      CORS_ORIGINS: http://localhost:8082,http://127.0.0.1:8082
      INITIAL_ADMIN_USERNAME: AuditAdmin
      INITIAL_ADMIN_PASSWORD: Audit-fixture-only-2026!
      SOULFIRE_URL: http://soulfire:38765
      SOULFIRE_SECRET_KEY_FILE: /soulfire-data/secret-key.bin
      LOG_LEVEL: warn
    volumes:
      - backend_data:/app/data
      - ./backend/scripts:/app/scripts:ro
      - soulfire_data:/soulfire-data:ro
    depends_on:
      soulfire:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
  web:
    image: afk-audit-web:latest
    build: ./frontend
    environment:
      SITE_ADDRESS: ":80"
    ports:
      - "127.0.0.1:8082:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  backend_data:
  soulfire_data:
